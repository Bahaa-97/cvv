<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Pro Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Georgia&family=Courier+New&family=Times+New+Roman&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- This is the container that html2pdf will capture -->
  <div class="resume-container" id="resume-container">
    
    <!-- HEADER -->
    <header class="header">
      <div class="header-photo-container" id="cv-photo-container" style="display:none;">
        <img id="cv-photo" src="" alt="Profile Photo" class="profile-photo" />
      </div>
      <div class="header-content">
        <h1 class="name" id="cv-fullName">Name Here</h1>
        <h2 class="job-title" id="cv-jobTitle">Job Title</h2>
      </div>
      <div class="contact-info">
        <div class="contact-item" id="cv-email-container">
          <i class="fa-solid fa-envelope"></i> <span id="cv-email"></span>
        </div>
        <div class="contact-item" id="cv-phone-container">
          <i class="fa-solid fa-phone"></i> <span id="cv-phone"></span>
        </div>
        <div class="contact-item" id="cv-location-container">
          <i class="fa-solid fa-location-dot"></i> <span id="cv-location"></span>
        </div>
        <div class="contact-item" id="cv-website-container">
          <i class="fa-solid fa-globe"></i> <span id="cv-website"></span>
        </div>
        <div class="contact-item" id="cv-linkedin-container">
          <i class="fa-brands fa-linkedin"></i> <span id="cv-linkedin"></span>
        </div>
        <div class="contact-item" id="cv-github-container">
          <i class="fa-brands fa-github"></i> <span id="cv-github"></span>
        </div>
      </div>
    </header>

    <!-- SUMMARY -->
    <section class="section" id="section-summary">
      <h3 class="section-title">Professional Summary</h3>
      <p class="summary-text" id="cv-summary"></p>
    </section>

    <div class="main-content">
      <!-- LEFT COLUMN -->
      <div class="col-left">
        <!-- EXPERIENCE -->
        <section class="section" id="section-experience">
          <h3 class="section-title">Experience</h3>
          <div class="list-container" id="cv-experience">
            <!-- Populated via JS -->
          </div>
        </section>

        <!-- EDUCATION -->
        <section class="section" id="section-education">
          <h3 class="section-title">Education</h3>
          <div class="list-container" id="cv-education">
            <!-- Populated via JS -->
          </div>
        </section>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">
        <!-- SKILLS -->
        <section class="section" id="section-skills">
          <h3 class="section-title">Skills</h3>
          <div class="skills-container" id="cv-skills">
            <!-- Populated via JS -->
          </div>
        </section>

        <!-- LANGUAGES -->
        <section class="section" id="section-languages">
          <h3 class="section-title">Languages</h3>
          <div class="languages-container" id="cv-languages">
            <!-- Populated via JS -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    // Logic to receive data from parent window and render it
    window.addEventListener('message', (event) => {
      const { type, data, design } = event.data;

      if (type === 'UPDATE_DATA') {
        renderData(data);
      } else if (type === 'UPDATE_DESIGN') {
        renderDesign(design);
      } else if (type === 'PREPARE_PRINT') {
        document.body.classList.add('print-mode');
      } else if (type === 'END_PRINT') {
        document.body.classList.remove('print-mode');
      } else if (type === 'DOWNLOAD_PDF') {
        const { filename } = event.data;
        const containerEl = document.getElementById('resume-container');
        if (!containerEl) { window.parent.postMessage({ type: 'DOWNLOAD_ERROR' }, '*'); return; }

        // ── Snapshot current inline styles ─────────────────────────────
        const snap = {
          htmlW:    document.documentElement.style.width,
          bodyW:    document.body.style.width,
          bodyM:    document.body.style.margin,
          bodyP:    document.body.style.padding,
          bodyOvf:  document.body.style.overflow,
          cW:       containerEl.style.width,
          cM:       containerEl.style.margin,
          cShadow:  containerEl.style.boxShadow,
          cMinH:    containerEl.style.minHeight,
        };

        // ── Force exact A4 width: 794 px = 210 mm @ 96 dpi ────────────
        // This ensures html2canvas captures no extra whitespace left/right.
        // The visual padding/margins inside the CV come from the CSS, not from
        // the PDF page margin (which stays at 0 to prevent any scaling).
        document.documentElement.style.width = '794px';
        document.body.style.width            = '794px';
        document.body.style.margin           = '0';
        document.body.style.padding          = '0';
        document.body.style.overflow         = 'visible';
        containerEl.style.width              = '794px';
        containerEl.style.margin             = '0';
        containerEl.style.boxShadow          = 'none';
        containerEl.style.minHeight          = 'auto';

        const restore = () => {
          document.documentElement.style.width = snap.htmlW;
          document.body.style.width            = snap.bodyW;
          document.body.style.margin           = snap.bodyM;
          document.body.style.padding          = snap.bodyP;
          document.body.style.overflow         = snap.bodyOvf;
          containerEl.style.width              = snap.cW;
          containerEl.style.margin             = snap.cM;
          containerEl.style.boxShadow          = snap.cShadow;
          containerEl.style.minHeight          = snap.cMinH;
        };

        // Wait a frame so the forced styles settle before capture
        setTimeout(() => {
          const opt = {
            margin:      0,
            filename:    filename || 'resume.pdf',
            image:       { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, windowWidth: 794, scrollX: 0, scrollY: 0, logging: false },
            jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:   { mode: ['css', 'legacy'] }
          };

          html2pdf().set(opt).from(containerEl).save().then(() => {
            restore();
            window.parent.postMessage({ type: 'DOWNLOAD_COMPLETE' }, '*');
          }).catch(err => {
            console.error('PDF Generation failed:', err);
            restore();
            window.parent.postMessage({ type: 'DOWNLOAD_ERROR' }, '*');
          });
        }, 300);
      } else if (type === 'PRINT_DOCUMENT') {
        window.print();
      }
    });

    function renderData(data) {
      if (!data) return;

      // Photo
      const photoContainer = document.getElementById('cv-photo-container');
      const photoImg = document.getElementById('cv-photo');
      if (data.personal.photo) {
        photoImg.src = data.personal.photo;
        photoContainer.style.display = 'block';
      } else {
        photoImg.src = '';
        photoContainer.style.display = 'none';
      }

      // Personal
      setText('cv-fullName', data.personal.fullName);
      setText('cv-jobTitle', data.personal.jobTitle);
      
      toggleItem('cv-email-container', 'cv-email', data.personal.email);
      toggleItem('cv-phone-container', 'cv-phone', data.personal.phone);
      
      const loc = [data.personal.city, data.personal.country].filter(Boolean).join(', ');
      toggleItem('cv-location-container', 'cv-location', loc);
      
      toggleItem('cv-website-container', 'cv-website', data.personal.website ? data.personal.website.replace(/^https?:\/\//, '') : '');
      
      // Social
      toggleItem('cv-linkedin-container', 'cv-linkedin', data.social.linkedin ? data.social.linkedin.replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//, '') : '');
      toggleItem('cv-github-container', 'cv-github', data.social.github ? data.social.github.replace(/^https?:\/\/(www\.)?github\.com\//, '') : '');

      // Summary
      const sumEl = document.getElementById('section-summary');
      if (data.summary && data.summary.trim() !== '') {
        sumEl.style.display = 'block';
        setText('cv-summary', data.summary);
      } else {
        sumEl.style.display = 'none';
      }

      // Experience
      const expContainer = document.getElementById('cv-experience');
      const expSection = document.getElementById('section-experience');
      if (data.experience && data.experience.length > 0) {
        expSection.style.display = 'block';
        expContainer.innerHTML = data.experience.map(item => `
          <div class="item">
            <div class="item-header">
              <div class="item-title-row">
                <span class="item-title">${item.title || ''}</span>
                <span class="item-company">${item.company ? ` | ${item.company}` : ''}</span>
              </div>
              <div class="item-meta">
                ${item.startDate ? `<span class="item-date">${item.startDate} - ${item.endDate || 'Present'}</span>` : ''}
                ${item.location ? `<span class="item-loc"><i class="fa-solid fa-location-dot"></i> ${item.location}</span>` : ''}
              </div>
            </div>
            ${item.description ? `<p class="item-desc">${item.description.replace(/\n/g, '<br>')}</p>` : ''}
          </div>
        `).join('');
      } else {
        expSection.style.display = 'none';
      }

      // Education
      const eduContainer = document.getElementById('cv-education');
      const eduSection = document.getElementById('section-education');
      if (data.education && data.education.length > 0) {
        eduSection.style.display = 'block';
        eduContainer.innerHTML = data.education.map(item => `
          <div class="item">
            <div class="item-header">
              <div class="item-title-row">
                <span class="item-title">${item.degree || ''}</span>
                <span class="item-company">${item.school ? ` | ${item.school}` : ''}</span>
              </div>
              <div class="item-meta">
                ${item.startDate ? `<span class="item-date">${item.startDate} - ${item.endDate || 'Present'}</span>` : ''}
                ${item.location ? `<span class="item-loc"><i class="fa-solid fa-location-dot"></i> ${item.location}</span>` : ''}
              </div>
            </div>
            ${item.description ? `<p class="item-desc">${item.description.replace(/\n/g, '<br>')}</p>` : ''}
          </div>
        `).join('');
      } else {
        eduSection.style.display = 'none';
      }

      // Skills
      const skillsContainer = document.getElementById('cv-skills');
      const skillsSection = document.getElementById('section-skills');
      if (data.skills && data.skills.length > 0) {
        skillsSection.style.display = 'block';
        skillsContainer.innerHTML = data.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('');
      } else {
        skillsSection.style.display = 'none';
      }

      // Languages
      const langContainer = document.getElementById('cv-languages');
      const langSection = document.getElementById('section-languages');
      if (data.languages && data.languages.length > 0) {
        langSection.style.display = 'block';
        langContainer.innerHTML = data.languages.map(lang => `
          <div class="lang-item">
            <span class="lang-name">${lang.name}</span>
            <span class="lang-level">${lang.level || ''}</span>
          </div>
        `).join('');
      } else {
        langSection.style.display = 'none';
      }
    }

    function renderDesign(design) {
      if (!design) return;
      
      const root = document.documentElement;
      root.style.setProperty('--primary-color', design.color);
      root.style.setProperty('--font-family', design.font);
      root.style.setProperty('--base-font-size', `${design.fontSize}px`);
      root.style.setProperty('--spacing-factor', design.spacing);
    }

    // Helpers
    function setText(id, text) {
      document.getElementById(id).textContent = text || '';
    }

    function toggleItem(containerId, textId, text) {
      const container = document.getElementById(containerId);
      if (text && text.trim() !== '') {
        container.style.display = 'flex';
        document.getElementById(textId).textContent = text;
      } else {
        container.style.display = 'none';
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
